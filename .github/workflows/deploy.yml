name: Deploy to Cloudflare Pages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: false

env:
  # Name of the Cloudflare Pages project (must already exist in your Cloudflare account)
  CLOUDFLARE_PROJECT_NAME: "b46c7261.portfolio-site-7x6"
  # Must match the production branch configured on the Pages project, so tagged builds go to production
  PRODUCTION_BRANCH: "main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy dist
            --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}
            --branch=${{ env.PRODUCTION_BRANCH }}
            --commit-hash=${{ github.sha }}
            --commit-message="${{ github.ref_name }}"
